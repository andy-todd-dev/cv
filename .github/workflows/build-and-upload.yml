name: Build CV and Upload to Google Drive

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required to request a GitHub OIDC token for WIF

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/andy-todd-dev/cv-builder:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build PDF
        run: bash build_pdf.sh

      - name: Authenticate to Google Cloud via Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: "https://www.googleapis.com/auth/drive.file"

      - name: Upload PDF to Google Drive
        env:
          GDRIVE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: bash upload_to_drive.sh
